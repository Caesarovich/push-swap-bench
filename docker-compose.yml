version: '3.8'

services:
  app:
    build: .
    image: push-swap-bench:latest
    container_name: push-swap-bench
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    # mount your local binaries into the container (read-only)
    volumes:
      - ./:/app:cached
      - ./push_swap:/app/push_swap:ro
      - ./checker:/app/checker:ro
      - data:/app/data
    command: ["bun", "run", "start"]

volumes:
  data:
    driver: local
